name: CI

on:
  push:
    branches: [main, 'ccr-**']
  pull_request:
  # Permet de relancer la CI (et l'APK de test) à la demande depuis GitHub.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter — format, analyse, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Localisations (doivent être à jour)
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

  database:
    name: Supabase — migrations et contrôles RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        # L'image installe PostGIS dans le schéma public de POSTGRES_DB :
        # on travaille donc dans une base créée à partir de template1, vierge
        # comme un projet Supabase (où PostGIS vit dans le schéma extensions).
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Créer une base vierge
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'create database rider_ci template template1'

      - name: Appliquer les migrations et exécuter les tests SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rider_ci
        run: scripts/check_migrations.sh

  build-android:
    name: Build Android (APK release, sans serveur)
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # Vérifie la chaîne de build release (R8, plugins natifs) à chaque push.
      - name: Build APK release (sans backend configuré)
        run: flutter build apk --release --dart-define=APP_BUILD="${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rider-group-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # APK de test relié au projet Supabase de développement (rider-group-dev).
  # Nécessite deux variables de dépôt (Settings → Secrets and variables →
  # Actions → Variables) : DEV_SUPABASE_URL et DEV_SUPABASE_PUBLISHABLE_KEY.
  # La clé « publishable » est publique par conception (protégée par RLS) ;
  # elle reste hors du dépôt par principe (voir docs/DECISIONS.md, D-05).
  # Signé avec la clé de production si les secrets ANDROID_* existent (SEC-01) :
  # les nouvelles versions s'installent alors par-dessus les anciennes.
  build-android-dev:
    name: APK de test connecté (dev)
    needs: flutter
    if: ${{ vars.DEV_SUPABASE_URL != '' && vars.DEV_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dépôts Gradle de secours (Maven Central pour tous les builds)
        # plugins.gradle.org renvoie parfois « Could not find kotlin-stdlib »
        # pour le build interne de Flutter : on ajoute Maven Central et Google.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repos.gradle <<'GRADLE'
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              gradlePluginPortal()
              mavenCentral()
              google()
            }
          }
          GRADLE

      - name: Configuration Firebase (notifications push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON absent : APK sans notifications push."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Clé de signature de production (secrets GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets ANDROID_* absents : APK signé avec une clé de débogage."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rider-release.jks"
          {
            echo "RIDER_KEYSTORE_PATH=$RUNNER_TEMP/rider-release.jks"
            echo "RIDER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RIDER_KEY_ALIAS=$KEY_ALIAS"
            echo "RIDER_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK release (projet dev)
        env:
          SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          build() {
            flutter build apk --release \
              --dart-define=APP_ENV=dev \
              --build-number="${{ github.run_number }}" \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
              --dart-define=APP_BUILD="${GITHUB_SHA::7}"
          }
          # Une nouvelle tentative si un téléchargement échoue.
          build || { sleep 30; build; }
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/rider-group-dev.apk

      - name: Empreinte de la signature de l'APK
        run: |
          # Signature v2/v3 (pas de signature JAR v1) : apksigner, pas keytool.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/rider-group-dev.apk \
            | grep -E "certificate DN|SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rider-group-dev-apk
          path: build/app/outputs/flutter-apk/rider-group-dev.apk
          retention-days: 14

  build-ios:
    name: Build iOS (sans signature)
    needs: flutter
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
