name: CI

on:
  push:
    branches: [main, 'ccr-**']
  pull_request:
  # Permet de relancer la CI (et l'APK de test) à la demande depuis GitHub.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter — format, analyse, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Localisations (doivent être à jour)
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

  database:
    name: Supabase — migrations et contrôles RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        # L'image installe PostGIS dans le schéma public de POSTGRES_DB :
        # on travaille donc dans une base créée à partir de template1, vierge
        # comme un projet Supabase (où PostGIS vit dans le schéma extensions).
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Créer une base vierge
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'create database rider_ci template template1'

      - name: Appliquer les migrations et exécuter les tests SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rider_ci
        run: scripts/check_migrations.sh

  build-android:
    name: Build Android (APK release, sans serveur)
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # Vérifie la chaîne de build release (R8, plugins natifs) à chaque push.
      - name: Build APK release (sans backend configuré)
        run: flutter build apk --release --dart-define=APP_BUILD="${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v5
        with:
          name: rider-group-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # APK de test relié au projet Supabase de développement (rider-group-dev).
  # Nécessite deux variables de dépôt (Settings → Secrets and variables →
  # Actions → Variables) : DEV_SUPABASE_URL et DEV_SUPABASE_PUBLISHABLE_KEY.
  # La clé « publishable » est publique par conception (protégée par RLS) ;
  # elle reste hors du dépôt par principe (voir docs/DECISIONS.md, D-05).
  # Signé avec la clé de debug : installable pour les tests, pas pour le Play Store.
  build-android-dev:
    name: APK de test connecté (dev)
    needs: flutter
    if: ${{ vars.DEV_SUPABASE_URL != '' && vars.DEV_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build APK release (projet dev)
        env:
          SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=APP_BUILD="${GITHUB_SHA::7}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/rider-group-dev.apk

      - uses: actions/upload-artifact@v5
        with:
          name: rider-group-dev-apk
          path: build/app/outputs/flutter-apk/rider-group-dev.apk
          retention-days: 14

  build-ios:
    name: Build iOS (sans signature)
    needs: flutter
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
